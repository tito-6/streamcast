user www-data;
worker_processes auto;
worker_rlimit_nofile 100000;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 20000;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    
    keepalive_timeout 65;
    keepalive_requests 100000;
    
    gzip on;
    gzip_types application/vnd.apple.mpegurl text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name sportevent.online www.sportevent.online;

        # HLS Stream Serving
        location /hls/ {
            alias /dev/shm/hls/;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range' always;
            
            location ~ \.m3u8$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header 'Access-Control-Allow-Origin' '*' always;
            }
            location ~ \.ts$ {
                expires max;
                add_header Cache-Control "public, max-age=31536000, immutable";
                add_header 'Access-Control-Allow-Origin' '*' always;
            }
        }

        # Sports Engine Proxy (Python)
        location /api/scores {
            proxy_pass http://127.0.0.1:8001/api/scores;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/sports-engine/ {
            proxy_pass http://127.0.0.1:8001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Proxy (Go Backend)
        location /api/ {
            proxy_pass http://127.0.0.1:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend Proxy (Next.js Server)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
