# High-Performance Nginx Configuration for 7,000+ Concurrent Viewers
# Optimized for HLS Video Streaming

user www-data;
worker_processes auto; # Use all available CPU cores
worker_rlimit_nofile 65535; # Match system ulimit
pid /run/nginx.pid;

events {
    worker_connections 16384; # 16k connections per worker
    use epoll; # Efficient connection processing on Linux
    multi_accept on; # Accept multiple connections at once
}

http {
    ##
    # Basic Settings
    ##
    sendfile on; # Zero-copy file transmission
    tcp_nopush on; # Send headers in one packet
    tcp_nodelay on; # Don't buffer data
    keepalive_timeout 15; # Close idle connections quickly
    keepalive_requests 1000; # Reuse connections efficiently
    types_hash_max_size 2048;
    server_tokens off; # Hide nginx version

    # Buffer sizes optimized for video
    client_body_buffer_size 256k;
    client_max_body_size 500M;
    client_header_buffer_size 4k;
    large_client_header_buffers 8 16k;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging Settings
    ##
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    ##
    # Gzip Settings (Disable for video)
    ##
    gzip off; # Don't compress video files

    ##
    # Virtual Host Configs
    ##
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
