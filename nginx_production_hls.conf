user www-data;
worker_processes auto; 
worker_rlimit_nofile 100000;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 100k Engine Tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    
    keepalive_timeout  65;
    keepalive_requests 100000;
    
    # AIO / Offloading
    aio threads;
    directio 4m; # Only directio large files, let sendfile handle small segments from RAM
    
    gzip on;
    gzip_types application/vnd.apple.mpegurl text/plain;

    server {
        # REUSEPORT for socket sharding efficiency
        listen 80 reuseport;
        
        server_name sportevent.online;

        root /var/www/frontend_static;
        index index.html;

        # HLS served from RAM DISK (/dev/shm)
        location /hls/ {
            alias /dev/shm/hls/;
            
            add_header Access-Control-Allow-Origin *;
            
            # Playlist: Never Cache
            location ~ \.m3u8$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
            
            # Segments: Cache Forever (RAM Disk holds them temporarily, browser caches them)
            location ~ \.ts$ {
                expires max;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }

        location /api/ {
            proxy_pass http://localhost:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri $uri/ $uri.html /index.html;
            expires 1h;
        }
    }
}
