server {
    server_name sportevent.online www.sportevent.online;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/sports-engine/ {
        proxy_pass http://localhost:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # CRITICAL FIX: Serve Next.js static assets directly to avoid proxy 404s
    location /_next/static {
        alias /var/www/frontend_static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /live.flv {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # Proxy Uploads to Backend
    location /uploads {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # HLS Static Hosting
    # HLS Static Hosting
    location /hls {
        root /var/www;       
        autoindex on;
        add_header Access-Control-Allow-Origin *;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        location ~ \.m3u8$ {
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin *;
        }

        location ~ \.ts$ {
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin *;
        }
    }

    location /archive/ {
        alias /var/www/archive/;
        add_header Access-Control-Allow-Origin *;
        autoindex on;
    }

    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/sportevent.online/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/sportevent.online/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

}

server {
    if ($host = sportevent.online) {
        return 301 https://$host$request_uri;
    } 
    if ($host = www.sportevent.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name sportevent.online www.sportevent.online;
    return 404; 
}
