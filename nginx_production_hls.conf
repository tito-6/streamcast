server {
    server_name sportevent.online www.sportevent.online;

    # Increase buffer sizes for high-quality video
    client_body_buffer_size 256k;
    client_max_body_size 500M;
    client_header_buffer_size 4k;
    large_client_header_buffers 8 16k;

    # Optimize TCP settings for streaming
    tcp_nodelay on;
    tcp_nopush on;
    sendfile on;
    sendfile_max_chunk 512k;

    # Keepalive for persistent connections
    keepalive_timeout 65;
    keepalive_requests 1000;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/sports-engine/ {
        proxy_pass http://localhost:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Increase buffer sizes for API
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }

    # CRITICAL FIX: Serve Next.js static assets directly
    location /_next/static {
        alias /var/www/frontend_static;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # FLV Live Stream - Optimized for low latency
    location /live.flv {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # CRITICAL: Disable buffering for live streaming
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # Increase buffer sizes for high bitrate
        proxy_buffer_size 512k;
        proxy_buffers 8 1024k;
        proxy_busy_buffers_size 2048k;
        
        # Timeouts for live streaming
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Headers for streaming
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Access-Control-Allow-Origin "*";
    }

    # Proxy Uploads to Backend
    location /uploads {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # HLS STREAMING - OPTIMIZED FOR 7,000+ CONCURRENT VIEWERS
    location /hls {
        root /var/www;
        
        # Performance Optimizations
        aio threads=default; # Asynchronous I/O with thread pool
        directio 4m; # Direct I/O for files > 4MB (bypass kernel cache)
        output_buffers 2 1m; # Output buffer optimization
        sendfile on; # Zero-copy transmission
        tcp_nopush on; # Send headers in one packet
        tcp_nodelay on; # Don't buffer data
        
        # Connection settings
        keepalive_timeout 15;
        keepalive_requests 1000;
        
        # CORS headers for HLS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        
        # Enable range requests for seeking
        add_header Accept-Ranges bytes always;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # Playlist files (.m3u8) - NO CACHE (always fresh)
        location ~ \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Access-Control-Allow-Origin * always;
            
            # Serve immediately
            sendfile on;
            tcp_nodelay on;
        }

        # Video segments (.ts) - AGGRESSIVE BROWSER CACHE
        location ~ \.ts$ {
            add_header Cache-Control "public, max-age=3600, immutable" always;
            add_header Access-Control-Allow-Origin * always;
            add_header Accept-Ranges bytes always;
            
            # Performance
            sendfile on;
            tcp_nopush on;
            
            # Serve from disk efficiently
            aio threads=default;
            directio 512k;
        }
    }

    location /archive/ {
        alias /var/www/archive/;
        add_header Access-Control-Allow-Origin *;
        autoindex on;
        
        # Enable range requests for VOD
        add_header Accept-Ranges bytes;
        
        # Cache VOD content
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    listen 443 ssl http2; 
    ssl_certificate /etc/letsencrypt/live/sportevent.online/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/sportevent.online/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # SSL optimizations
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
}

server {
    if ($host = sportevent.online) {
        return 301 https://$host$request_uri;
    } 
    if ($host = www.sportevent.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name sportevent.online www.sportevent.online;
    return 404; 
}
